name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on PR branches, but let every push to main finish
# (cancelling main runs left merge commits without a CI result).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # scripts/run-tests.mjs fails when zero tests run.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_USE_REAL_DATA: "false"

  # Rebuilds the database from supabase/migrations on an empty local Supabase
  # Postgres and runs the SQL smoke check. Never talks to the hosted project.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_CLI_VERSION: 3.1.0
      # sha256 of supabase_linux_amd64.tar.gz from the release's checksums file.
      SUPABASE_CLI_SHA256: dbe9fd66771337fc198727da86b9d3551302f87a7091cd8781be2a4cd0c8ac4d
      SUPABASE_TELEMETRY_DISABLED: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Supabase CLI (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  /tmp/supabase.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Reset from zero (re-applies every migration)
        run: supabase db reset

      - name: Smoke check
        run: psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql

      - name: RLS and privilege tests (anon / owner / other user / moderator)
        run: psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/policies.sql

      - name: Schema signature (for drift comparison)
        run: psql "$DB_URL" -X -tA -v ON_ERROR_STOP=1 -f supabase/tests/schema-signature.sql
